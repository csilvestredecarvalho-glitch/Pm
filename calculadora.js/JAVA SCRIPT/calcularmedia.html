<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Escolar</title>
    
    <link rel="stylesheed"href="style">
</head>
<body>
    <div class="container">
        <h2>Calculadora de Média</h2>
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" placeholder="Ex: 7.5" step="0.1" min="0" max="10">
        
        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" placeholder="Ex: 8.0" step="0.1" min="0" max="10">
        
        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" placeholder="Ex: 7.5" step="0.1" min="0" max="10">
        
        <label for="nota4">Nota 4:</label>
        <input type="number" id="nota4" placeholder="Ex: 8.0" step="0.1" min="0" max="10">
        
        <button id="btnCalcular" onclick="calcular()">Calcular Média</button>
        <div id="resultado"></div>
    </div>

    <script>
        function calcular() {
            
            const n1 = parseFloat(document.getElementById('nota1').value);
            const n2 = parseFloat(document.getElementById('nota2').value);
            const n3 = parseFloat(document.getElementById('nota3').value);
            const n4 = parseFloat(document.getElementById('nota4').value);
            const divResultado = document.getElementById('resultado');

            
            if (isNaN(n1) || isNaN(n2) || isNaN(n3) || isNaN(n4)) {
                divResultado.innerHTML = "Por favor, preencha todas as notas.";
                divResultado.style.color = "red";
                return;
            }

            
            const media = (n1 + n2 + n3 + n4) / 4;
            let situacao = "";
            let cor = "";

            if (media >= 7) {
                situacao = "Aprovado";
                cor = "green";
            } else if (media >= 5) {
                situacao = "Recuperação";
                cor = "blue";
            } else {
                situacao = "Reprovado";
                cor = "red";
            }

            
            divResultado.innerHTML = `Média: ${media.toFixed(1)}<br>Situação: ${situacao}`;
            divResultado.style.color = cor;
        }
    </script>
</body>
</html>
